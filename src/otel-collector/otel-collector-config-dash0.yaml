extensions:
  healthcheckv2:
    use_v2: true
    component_health:
      include_permanent_errors: false
      include_recoverable_errors: true
      recovery_duration: 5m
    http:
      endpoint: "localhost:13133"
      status:
        enabled: true
        path: "/health/status"
  bearertokenauth/dash0:
    scheme: Bearer
    token: ${env:DASH0_AUTHORIZATION_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_GRPC}
      http:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_HTTP}
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    initial_delay: 300s
  hostmetrics:
    root_path: /hostfs
    initial_delay: 300s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
          system.cpu.logical.count:
            enabled: true
      disk:
      load:
      filesystem:
        exclude_mount_points:
          mount_points:
            - /dev/*
            - /proc/*
            - /sys/*
            - /run/k3s/containerd/*
            - /var/lib/docker/*
            - /var/lib/kubelet/*
            - /snap/*
          match_type: regexp
        exclude_fs_types:
          fs_types:
            - autofs
            - binfmt_misc
            - bpf
            - cgroup2
            - configfs
            - debugfs
            - devpts
            - devtmpfs
            - fusectl
            - hugetlbfs
            - iso9660
            - mqueue
            - nsfs
            - overlay
            - proc
            - procfs
            - pstore
            - rpc_pipefs
            - securityfs
            - selinuxfs
            - squashfs
            - sysfs
            - tracefs
          match_type: strict
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
          system.memory.limit:
            enabled: true
      network:
      paging:
        metrics:
          system.paging.usage:
            enabled: true

      processes:
      process:
        mute_process_exe_error: true
        mute_process_io_error: true
        mute_process_user_error: true
      system:
        metrics:
          system.uptime:
            enabled: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1000
  resource:
    attributes:
      - key: deployment.environment.name
        value: "kubecon-eu-2026"
        action: upsert

exporters:
  debug:
  # verbosity: detailed
  otlp/dash0:
    auth:
      authenticator: bearertokenauth/dash0
    endpoint: ${env:DASH0_ENDPOINT}
    headers:
      Dash0-Dataset: ${env:DASH0_DATASET:-default}
    sending_queue:
      batch:
        min_size: 10
        max_size: 100
        flush_timeout: 10s

service:
  extensions: [healthcheckv2, bearertokenauth/dash0]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource]
      exporters: [debug, otlp/dash0]
    metrics:
      receivers: [otlp, docker_stats, hostmetrics]
      processors: [memory_limiter, resource]
      exporters: [debug, otlp/dash0]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource]
      exporters: [otlp/dash0]
  telemetry:
    resource:
      deployment.environment.name: otelfeature
    metrics:
      level: detailed
      readers:
        - periodic:
            interval: 15000
            exporter:
              otlp:
                protocol: grpc
                endpoint: https://${env:DASH0_ENDPOINT}
                headers:
                  - name: Authorization
                    value: Bearer ${env:DASH0_AUTHORIZATION_TOKEN}
                  - name: Dash0-Dataset
                    value: ${env:DASH0_DATASET:-default}
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                protocol: grpc
                endpoint: https://${env:DASH0_ENDPOINT}
                headers:
                  - name: Authorization
                    value: Bearer ${env:DASH0_AUTHORIZATION_TOKEN}
                  - name: Dash0-Dataset
                    value: ${env:DASH0_DATASET:-default}